services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: compras, POSTGRES_PASSWORD: compras, POSTGRES_DB: compras_db }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compras -d compras_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://compras:compras@db:5432/compras_db
      # CXP_URL: http://cuentas-por-pagar:8000      # cuando el otro equipo tenga su API
      # ACTIVOS_URL: http://activos-fijos:8000
      # PLANILLAS_URL: http://planillas:8000
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  web:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npx vite --host 0.0.0.0"
    environment: { API_URL: "http://api:8000" }
    ports: ["5173:5173"]
    depends_on: [api]
volumes: { pgdata: {} }
